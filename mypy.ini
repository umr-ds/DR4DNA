# Mypy Configuration for DR4DNA
[mypy]
# Platform configuration
python_version = 3.12
platform = linux

# Strict mode options
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Disallow dynamic typing
disallow_any_generics = false  # Too strict for Dash callbacks
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# None and Optional handling
no_implicit_optional = true
strict_optional = true

# Warnings
warn_no_return = true

# Import discovery
ignore_missing_imports = true  # Ignore missing stubs for third-party libs
follow_imports = normal
follow_imports_for_stubs = true

# Error reporting
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
show_traceback = true

# Incremental mode
incremental = true
cache_dir = .mypy_cache

# Exclude patterns
exclude = ^tests/|^venv/|^\.venv/|^build/|^dist/

# Per-module overrides
[mypy-app.*]
disallow_any_generics = false  # Dash callbacks use generics heavily

[mypy-callback_handlers.*]
disallow_any_generics = false

[mypy-repair_algorithms.*]
disallow_untyped_defs = false  # Legacy plugin code
disallow_incomplete_defs = false

[mypy-state]
strict = true

[mypy-constants]
strict = true

[mypy-utils]
strict = true

[mypy-exceptions]
strict = true

[mypy-logger]
strict = true

# Third-party modules without type stubs
[mypy-norec4dna.*]
ignore_missing_imports = true

[mypy-dash.*]
ignore_missing_imports = true

[mypy-dash_extensions.*]
ignore_missing_imports = true

[mypy-flask.*]
ignore_missing_imports = true

[mypy-numpy.*]
ignore_missing_imports = true

[mypy-googletrans.*]
ignore_missing_imports = true

[mypy-language_tool_python.*]
ignore_missing_imports = true

[mypy-Levenshtein.*]
ignore_missing_imports = true

[mypy-magic.*]
ignore_missing_imports = true

[mypy-dash_canvas.*]
ignore_missing_imports = true

[mypy-dash_daq.*]
ignore_missing_imports = true
