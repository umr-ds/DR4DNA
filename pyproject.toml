[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "DR4DNA"
version = "1.0.0b"
description = "Data recovery methods for DNA storage based on fountain codes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "UMR-DS", email = "TODO@example.com"}
]
keywords = ["dna-storage", "fountain-codes", "error-correction", "data-recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "dash-canvas~=0.1.0",
    "singleton_decorator~=1.0.0",
    "language-tool-python",
    "pyspellchecker",
    "numpy",
    "Flask",
    "Jinja2~=3.1.2",
    "dash-extensions",
    "dash-mantine-components",
    "dash",
    "python-dateutil",
    "python-magic~=0.4.27",
    "googletrans~=4.0.0rc1",
    "Levenshtein",
    "dash-daq",
    "kaitaistruct~=0.10",
    "crcmod~=1.7",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/umr-ds/DR4DNA"
Repository = "https://github.com/umr-ds/DR4DNA.git"

[tool.setuptools]
packages = ["."]

[tool.setuptools_scm]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | NOREC4DNA
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["NOREC4DNA", "build", "dist", ".git", ".venv"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "NOREC4DNA",
    ".venv",
]
extend-ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "W503",  # line break before binary operator (conflicts with black)
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["NOREC4DNA", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["repair_algorithms/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=repair_algorithms --cov-report=term-missing"
